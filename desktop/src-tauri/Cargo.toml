[package]
name = "three-yiddish-desktop"
version = "0.2.0"
description = "3Yiddish desktop app: Yiddish speech to text in a native window"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "three_yiddish_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "3yiddish-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
three-yiddish = { path = "../.." }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# The same versions the core uses (nothing new is compiled): Send's request to 3Yiddish.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }

[features]
# Graphics card through Vulkan (Windows, Linux). macOS always uses Metal.
vulkan = ["three-yiddish/vulkan"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Development builds still run the speech model at full speed: whisper.cpp built as
# Release and the other dependencies optimized (only this crate stays debuggable).
[profile.dev.package."*"]
opt-level = 3
