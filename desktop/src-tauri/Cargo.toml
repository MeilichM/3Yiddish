[package]
name = "three-yiddish-desktop"
version = "0.6.1"
description = "3Yiddish desktop app: Yiddish speech to text in a native window"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "three_yiddish_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "3yiddish-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
three-yiddish = { path = "../.." }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# The same versions the core uses (nothing new is compiled): Send's request to 3Yiddish.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }

# Push-to-talk on modifier keys alone (Ctrl + Win): a keyboard hook, since a global shortcut
# needs one ordinary key.
# The second speech model (Omnilingual-based, through ONNX Runtime) runs everywhere the core's
# release builds run it: every computer but an Intel Mac.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
three-yiddish = { path = "../..", features = ["omni"] }

[target.'cfg(target_os = "macos")'.dependencies]
# _exit on quit (see the RunEvent::Exit handler in lib.rs).
libc = "0.2"
# Asking for the microphone before push-to-talk records (permissions.rs).
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Graphics card through Vulkan (Windows, Linux). macOS always uses Metal.
vulkan = ["three-yiddish/vulkan"]
# Linux release builds: the Omnilingual engine on systems older than its runtime was built for
# (the core's `old-linux`; see release.yml and desktop-release.yml).
old-linux = ["three-yiddish/old-linux"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Development builds still run the speech model at full speed: whisper.cpp built as
# Release and the other dependencies optimized (only this crate stays debuggable).
[profile.dev.package."*"]
opt-level = 3
