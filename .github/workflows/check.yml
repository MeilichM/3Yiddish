name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev cmake clang
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy && rustup default 1.98.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        name: Installer syntax (sh)
        run: sh -n install/install.sh
      - if: runner.os == 'Windows'
        name: Installer syntax (Windows PowerShell)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
  # The graphics-card (Vulkan) builds that a release ships, compiled here so breakage shows
  # before a tag. Same SDK setup as release.yml.
  vulkan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VULKAN_SDK_VERSION: 1.4.313.0
      VULKAN_SDK_WINDOWS_SHA256: b643ca8ab4aea5c47b9c4e021a0b33b3a13871bf1d8131e162a9e48c257c4694
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        name: Vulkan SDK (Linux)
        run: |
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          echo "deb https://packages.lunarg.com/vulkan/${VULKAN_SDK_VERSION%.*} jammy main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev cmake clang vulkan-headers libvulkan-dev shaderc
          glslc --version
      - if: runner.os == 'Windows'
        id: vulkan-sdk
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}
      - if: runner.os == 'Windows' && steps.vulkan-sdk.outputs.cache-hit != 'true'
        name: Vulkan SDK (Windows)
        shell: pwsh
        run: |
          $v = $env:VULKAN_SDK_VERSION
          $f = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          curl.exe -fsSL --retry 3 -o $f "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          if ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $env:VULKAN_SDK_WINDOWS_SHA256) { throw 'Vulkan SDK installer failed its checksum' }
          $p = Start-Process $f -Wait -PassThru -ArgumentList '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe") -or -not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw 'Vulkan SDK is incomplete' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          # A short build folder: the Vulkan shader build nests deep enough to pass the
          # Windows 260-character path limit under the normal checkout path.
          "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy && rustup default 1.98.0
      - run: cargo clippy --locked --bin 3yiddish --features vulkan -- -D warnings
      # Runs the updater's tests as a Vulkan build. Linux only: the Windows machine has no
      # graphics driver, so a Vulkan program cannot start there.
      - if: runner.os == 'Linux'
        run: cargo test --locked --features vulkan --lib update
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy --target aarch64-linux-android && rustup default 1.98.0
      - run: cargo install cargo-ndk --locked
      - name: Clippy for Android (Termux)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" GGML_NATIVE=OFF GGML_OPENMP=OFF
          # Phones have no libc++_shared.so: point that name at the static C++ library, so the
          # file carries it inside and needs only Android's own system libraries.
          mkdir -p "$RUNNER_TEMP/cxx" && echo 'INPUT(-lc++_static -lc++abi)' > "$RUNNER_TEMP/cxx/libc++_shared.so"
          export RUSTFLAGS="-L native=$RUNNER_TEMP/cxx"
          cargo ndk -t arm64-v8a -P 24 clippy --locked --bin 3yiddish -- -D warnings
          cargo ndk -t arm64-v8a -P 24 build --release --locked --bin 3yiddish
          if readelf -d target/aarch64-linux-android/release/3yiddish | grep -E 'NEEDED' | grep -v -E 'lib(c|m|dl|log)\.so'; then
            echo "The Android build needs a library phones do not have." >&2; exit 1
          fi
